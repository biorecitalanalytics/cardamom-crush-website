backend:
  name: git-gateway
  branch: main

media_folder: "assets/menu"
public_folder: "/assets/menu"

publish_mode: simple

site_url: https://cardamomcrush.ca
display_url: https://cardamomcrush.ca
logo_url: /assets/cardamom-crush-logo.png

collections:
  - name: "site_content"
    label: "Site Content"
    files:
      - name: "editable_content"
        label: "Menu & Website Content"
        file: "data/site.json"
        format: "json"
        fields:
          - label: "Business Info"
            name: "business"
            widget: "object"
            fields:
              - { label: "Business Name", name: "name", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Website", name: "website", widget: "string", required: false }
              - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
              - { label: "Instagram Handle", name: "instagramHandle", widget: "string", required: false }
              - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
              - { label: "Facebook Handle", name: "facebookHandle", widget: "string", required: false }

          - label: "Menu Sections"
            name: "menuSections"
            widget: "list"
            label_singular: "Menu Section"
            allow_add: true
            collapsed: true
            summary: "{{fields.title}}"
            hint: "Add sections such as Cookies, Cupcakes, or Puddings. Drag sections to reorder them, use the trash icon to delete one, or turn off Show this section to keep it saved but hide it."
            fields:
              - { label: "Section Title", name: "title", widget: "string" }
              - { label: "Show this section", name: "visible", widget: "boolean", default: true, required: false, hint: "Turn this off to hide the entire section without deleting it." }
              - label: "Items"
                name: "items"
                widget: "list"
                label_singular: "Menu Item"
                allow_add: true
                collapsed: true
                summary: "{{fields.name}} — {{fields.status}}"
                hint: "Use Add Menu Item to create an item. Drag items to reorder them, use the trash icon to delete one, or choose Hidden to keep it saved without showing it publicly."
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - label: "Menu Status"
                    name: "status"
                    widget: "select"
                    default: "available"
                    required: false
                    options:
                      - { label: "Available", value: "available" }
                      - { label: "Sold out", value: "sold-out" }
                      - { label: "Hidden", value: "hidden" }
                    hint: "Sold out keeps the item visible with a label. Hidden removes it from the public menu without deleting it."
                  - { label: "Description", name: "description", widget: "text", required: false }
                  - { label: "Price", name: "price", widget: "string", required: false, hint: "Include the currency symbol, for example $6." }
                  - { label: "Picture", name: "image", widget: "image", required: false, hint: "Upload a JPG, PNG, or WebP photo." }
                  - { label: "Dietary Notes", name: "dietary", widget: "string", required: false }
                  - label: "Ingredients"
                    name: "ingredients"
                    widget: "list"
                    required: false
                    field: { label: "Ingredient", name: "ingredient", widget: "string" }
                  - { label: "Recipe / Prep Note", name: "recipeNote", widget: "text", required: false }

          - label: "Product Gallery"
            name: "galleryImages"
            widget: "list"
            label_singular: "Gallery Image"
            allow_add: true
            collapsed: true
            summary: "{{fields.alt}}"
            hint: "Add product photographs for the homepage gallery. Use the trash icon to remove an image or drag images to reorder them."
            fields:
              - { label: "Product Image", name: "image", widget: "image" }
              - { label: "Image Description", name: "alt", widget: "string", hint: "Briefly describe what is pictured for accessibility and search engines." }
              - { label: "Caption", name: "caption", widget: "string", required: false }

          - label: "Customer Reviews"
            name: "customerReviews"
            widget: "list"
            label_singular: "Customer Review"
            allow_add: true
            collapsed: true
            summary: "{{fields.name}} — {{fields.quote}}"
            hint: "Only publish reviews you have permission to share. Use a first name or initials if the customer prefers privacy."
            fields:
              - { label: "Review", name: "quote", widget: "text" }
              - { label: "Customer Name", name: "name", widget: "string", required: false }
              - { label: "Context", name: "context", widget: "string", required: false, hint: "For example: Farmers market customer or Catering client." }

          - label: "Market Venues"
            name: "marketVenues"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Location", name: "location", widget: "string", required: false }
              - { label: "Schedule", name: "schedule", widget: "string", required: false }
              - { label: "Booth", name: "booth", widget: "string", required: false }
              - { label: "Notes", name: "notes", widget: "text", required: false }

          - label: "Catering Products"
            name: "cateringProducts"
            widget: "list"
            field: { label: "Product", name: "product", widget: "string" }

          - label: "Links Page Buttons"
            name: "linksPage"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Page URL", name: "url", widget: "string", required: false }
              - { label: "Business Link Key", name: "businessLink", widget: "string", required: false, hint: "Use instagram, facebook, or email to pull from Business Info." }
              - { label: "Icon", name: "icon", widget: "select", required: false, options: ["", "instagram", "facebook"] }
