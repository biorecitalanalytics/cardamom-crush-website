backend:
  name: git-gateway
  branch: main

media_folder: "assets/menu"
public_folder: "/assets/menu"

publish_mode: simple

site_url: https://cardamomcrush.ca
display_url: https://cardamomcrush.ca
logo_url: /assets/cardamom-crush-logo.png

collections:
  - name: "site_content"
    label: "Site Content"
    files:
      - name: "editable_content"
        label: "Menu & Website Content"
        file: "data/site.json"
        format: "json"
        fields:
          - label: "Business Info"
            name: "business"
            widget: "object"
            fields:
              - { label: "Business Name", name: "name", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string", required: false }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Website", name: "website", widget: "string", required: false }
              - { label: "Instagram URL", name: "instagram", widget: "string", required: false }
              - { label: "Instagram Handle", name: "instagramHandle", widget: "string", required: false }
              - { label: "Facebook URL", name: "facebook", widget: "string", required: false }
              - { label: "Facebook Handle", name: "facebookHandle", widget: "string", required: false }

          - label: "Menu Sections"
            name: "menuSections"
            widget: "list"
            summary: "{{fields.title}}"
            hint: "Drag sections to change their order. Turn off Show this section to temporarily hide a whole category."
            fields:
              - { label: "Section Title", name: "title", widget: "string" }
              - { label: "Show this section", name: "visible", widget: "boolean", default: true, required: false, hint: "Turn this off to hide the entire section without deleting it." }
              - label: "Items"
                name: "items"
                widget: "list"
                summary: "{{fields.name}} — {{fields.status}}"
                hint: "Drag items to change their display order. Hidden items stay saved here but disappear from the public menu."
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - label: "Menu Status"
                    name: "status"
                    widget: "select"
                    default: "available"
                    required: false
                    options:
                      - { label: "Available", value: "available" }
                      - { label: "Sold out", value: "sold-out" }
                      - { label: "Hidden", value: "hidden" }
                    hint: "Sold out keeps the item visible with a label. Hidden removes it from the public menu without deleting it."
                  - { label: "Description", name: "description", widget: "text", required: false }
                  - { label: "Price", name: "price", widget: "string", required: false, hint: "Include the currency symbol, for example $6." }
                  - { label: "Picture", name: "image", widget: "image", required: false, hint: "Upload a JPG, PNG, or WebP photo." }
                  - { label: "Dietary Notes", name: "dietary", widget: "string", required: false }
                  - label: "Ingredients"
                    name: "ingredients"
                    widget: "list"
                    required: false
                    field: { label: "Ingredient", name: "ingredient", widget: "string" }
                  - { label: "Recipe / Prep Note", name: "recipeNote", widget: "text", required: false }

          - label: "Market Venues"
            name: "marketVenues"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Location", name: "location", widget: "string", required: false }
              - { label: "Schedule", name: "schedule", widget: "string", required: false }
              - { label: "Booth", name: "booth", widget: "string", required: false }
              - { label: "Notes", name: "notes", widget: "text", required: false }

          - label: "Catering Products"
            name: "cateringProducts"
            widget: "list"
            field: { label: "Product", name: "product", widget: "string" }

          - label: "Links Page Buttons"
            name: "linksPage"
            widget: "list"
            summary: "{{fields.label}}"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Page URL", name: "url", widget: "string", required: false }
              - { label: "Business Link Key", name: "businessLink", widget: "string", required: false, hint: "Use instagram, facebook, or email to pull from Business Info." }
              - { label: "Icon", name: "icon", widget: "select", required: false, options: ["", "instagram", "facebook"] }
